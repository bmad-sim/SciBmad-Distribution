name: Build Release Assets

on:
  workflow_dispatch:
    inputs:
      upload_tag:
        description: 'Optional: Release tag to upload to'
        required: false
        default: ''
        type: string
  release:
    types: [created]

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # The x86_64 targets take the longest and are the ones that have been failing,
      # so a shared fail-fast keeps cancelling them before they can report anything.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            os: macos
            arch: x86_64
          - runner: macos-latest
            os: macos
            arch: aarch64
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
            xvfb: true
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            xvfb: true
          - runner: windows-latest
            os: windows
            arch: x86_64
    
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v3
      # `Pkg.build()` is not redundant with `instantiate`. This dependency tree keeps its
      # build products in `~/.julia/conda`: PyCall's generated `deps/deps.jl` hardcodes a
      # libpython there, and AppBundler's `deps/build.jl` installs the `ds_store` Python
      # module into it. `julia-actions/cache` restores the evidence that those builds
      # happened -- `deps.jl` in `~/.julia/packages`, Pkg's build records in
      # `~/.julia/scratchspaces` -- but it does not cache `~/.julia/conda` itself. On a
      # cache hit `instantiate` therefore skips the builds and `import AppBundler` dies in
      # a module `__init__`, either as `could not load library ... libpython3.13` or as
      # `Failed to import Python module 'ds_store'`. Forcing every build, rather than the
      # one that failed last, keeps the conda environment in step with the records that
      # describe it. Costs ~40s against a build of roughly an hour.
      - name: Install dependencies
        run: julia --project=meta -e 'using Pkg; Pkg.instantiate(); Pkg.build()'
      # The linux-x86_64 runner has twice been killed mid-`Precompiling SciBmad` with
      # no Julia error, taking the runner agent with it (its `if: always()` steps never
      # ran), which is what an OOM kill looks like from the outside. x86_64 bundles are
      # compiled for three CPU targets at once, so they need far more memory than the
      # single-target aarch64 ones, which pass. 16G of extra swap absorbs the peak.
      - name: Add swap space
        if: matrix.os == 'linux'
        run: |
          sudo fallocate -l 16G /swapfile-extra
          sudo chmod 600 /swapfile-extra
          sudo mkswap /swapfile-extra
          sudo swapon /swapfile-extra
          swapon --show
      # A bundle build runs for ~40 minutes and writes several GB into the staging
      # area, so a job that dies without a Julia error is usually the runner running
      # out of disk or memory. Reported before and after the build so a killed job
      # still leaves evidence behind.
      - name: Report free disk and memory (before build)
        shell: bash
        run: |
          df -h
          case "${{ runner.os }}" in
            Linux) free -h ;;
            macOS) vm_stat && sysctl -n hw.memsize ;;
            Windows) powershell -c "Get-CimInstance Win32_OperatingSystem | Format-List FreePhysicalMemory,TotalVisibleMemorySize" ;;
          esac
      # `delete!(ENV, "CI")` is load bearing. AppBundler picks how to compile the bundled
      # packages from `haskey(ENV, "CI")` (`JuliaImg.jl:93`): unset, it calls
      # `Pkg.precompile`; set -- as it always is on a runner -- it `import`s every package
      # instead (`JuliaImg.jl:285-288`). `import` runs each package's `__init__`, and
      # PythonCall's resolves a Conda environment, which inside the staging tree ends as
      # `InitError: Python executable ".../.CondaPkg/.pixi/envs/default/bin/python" does
      # not exist`. `Pkg.precompile` never runs `__init__`, so it compiles PythonCall and
      # its extensions without needing a Python interpreter at build time. Deleting the
      # variable from Julia rather than from the shell keeps this identical on Windows,
      # where the default shell has no `env -u`.
      # `JULIA_CONDAPKG_BACKEND=Null` is for Windows, the one platform with no
      # Python_jll build: there the patch that points PythonCall at the bundled
      # interpreter has nothing to point at, and PythonCall would resolve an empty
      # Conda environment inside the staging tree and fail the same way. `Null` makes
      # it use the runner's own `python`, which only has to satisfy `__init__` while
      # packages compile -- nothing about it enters the bundle. On every other
      # platform the patch sets this same value itself.
      # Split from the build below only so the Linux jobs can sample memory while the
      # build runs. The samples are streamed into this step's own log rather than
      # reported afterwards, because a runner taken down by the OOM killer never gets
      # to run another step, while log lines already written survive.
      - name: Build (with memory sampling)
        if: matrix.os == 'linux'
        env:
          JULIA_CONDAPKG_BACKEND: Null
        run: |
          (while true; do sleep 30; free -m | sed -n -e 2p -e 3p; done) &
          sampler=$!
          trap "kill $sampler 2>/dev/null || true" EXIT
          ${{ matrix.xvfb && 'xvfb-run -s ''-screen 0 1024x768x24''' || '' }} julia --project=meta -e 'delete!(ENV, "CI"); import AppBundler; AppBundler.main(ARGS)' build . --build-dir=build --target-arch=${{ matrix.arch }} --password=
      - name: Build
        if: matrix.os != 'linux'
        env:
          PASSWORD: ${{ matrix.os == 'macos' && secrets.MACOS_PFX_PASSWORD || matrix.os == 'windows' && secrets.WINDOWS_PFX_PASSWORD || '' }}
          JULIA_CONDAPKG_BACKEND: Null
        run: |
          julia --project=meta -e 'delete!(ENV, "CI"); import AppBundler; AppBundler.main(ARGS)' build . --build-dir=build --target-arch=${{ matrix.arch }} --password=${{ env.PASSWORD }}
      - name: Report free disk and memory (after build)
        if: always()
        shell: bash
        run: |
          df -h
          case "${{ runner.os }}" in
            Linux) free -h ;;
            macOS) vm_stat && sysctl -n hw.memsize ;;
            Windows) powershell -c "Get-CimInstance Win32_OperatingSystem | Format-List FreePhysicalMemory,TotalVisibleMemorySize" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: build/*
          retention-days: 1

  upload:
    name: Upload to release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' || github.event.inputs.upload_tag != ''
    
    steps:
      - uses: actions/checkout@v4
        
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ github.event.inputs.upload_tag || github.event.release.tag_name }}"
          echo "Uploading to release: $TAG_NAME"
          
          find artifacts/ -type f | while read -r file; do
            echo "Uploading: $file"
            gh release upload "$TAG_NAME" "$file"
          done
          
          echo "All artifacts uploaded successfully!"
